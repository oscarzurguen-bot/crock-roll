<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Escena de juego a pantalla completa, aspecto oscuro único (habitación al atardecer) */
:root{
  --bg:#120d1f; --panel:#1b1430; --panel2:#251c3e; --line:rgba(255,255,255,.09);
  --green:#a3e635; --green-d:#5f8f12; --orange:#ffa245; --text:#f4effc; --muted:#a99cc4; --red:#ff5d6e; --gold:#f3c14b;
  --sea:#a9c4d6; --land:#f2ead8; --border:#9b8f78;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- ESCENA ---------- */
#viewport{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#2a1d45 0%,var(--bg) 70%)}
/* fondo: la misma habitación ampliada y desenfocada, para que no haya franjas negras sin recortar la imagen */
#fondo{position:absolute;inset:-40px;background:url(habitacion.webp) center/cover no-repeat;filter:blur(22px) brightness(.8) saturate(1.1);transform:scale(1.08)}
/* bordes de arriba y abajo de la imagen difuminados para que se fundan con el fondo */
#room{-webkit-mask-image:linear-gradient(transparent,#000 3%,#000 97%,transparent);mask-image:linear-gradient(transparent,#000 3%,#000 97%,transparent)}
#stage{position:absolute;transition:transform .55s cubic-bezier(.6,.05,.3,1),filter .55s;will-change:transform}
#stage.zoomed{filter:brightness(.55) blur(1px)}
#room{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;border-radius:6px}
.fx{position:absolute;pointer-events:none}

.sun{left:0;top:0;width:75%;height:100%;mix-blend-mode:screen;
  background:linear-gradient(120deg,rgba(255,160,70,0) 8%,rgba(255,170,80,.20) 28%,rgba(255,140,60,.05) 48%,rgba(255,140,60,0) 60%);
  animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}

.glow{border-radius:50%;mix-blend-mode:screen;transform:translate(-50%,-50%)}
.lamp{left:49.6%;top:8.1%;width:70%;aspect-ratio:1;background:radial-gradient(circle,rgba(255,190,110,.38) 0%,rgba(255,160,80,.12) 35%,transparent 65%);animation:flicker 4s infinite}
.cone{left:27.1%;top:8.3%;width:45%;height:40%;mix-blend-mode:screen;clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);
  background:linear-gradient(rgba(255,190,120,.16),transparent 85%);animation:breathe 5s ease-in-out infinite}
.globe{left:19.6%;top:26.7%;width:22%;aspect-ratio:1;background:radial-gradient(circle,rgba(255,215,130,.75) 0%,rgba(255,170,80,.2) 40%,transparent 70%);animation:pulse 3.2s ease-in-out infinite}
@keyframes flicker{0%,100%{opacity:1}45%{opacity:.85}48%{opacity:.6}50%{opacity:.95}70%{opacity:.88}}
@keyframes pulse{0%,100%{opacity:.65;transform:translate(-50%,-50%) scale(.92)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}

.screen{left:26.9%;top:45.3%;width:24.1%;height:7.8%;mix-blend-mode:soft-light;border-radius:2px;
  background:linear-gradient(180deg,rgba(255,120,200,.5),rgba(255,200,90,.4),rgba(90,60,200,.5));background-size:100% 300%;animation:sky 9s ease-in-out infinite}
@keyframes sky{0%,100%{background-position:0 0}50%{background-position:0 100%}}

#dust span{position:absolute;border-radius:50%;background:#ffd9a0;box-shadow:0 0 6px #ffb860;opacity:0;animation:dust linear infinite}
@keyframes dust{0%{opacity:0;transform:translate(0,0)}15%{opacity:.8}85%{opacity:.6}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}

/* notas musicales */
.note{position:absolute;font-size:clamp(14px,4.5vw,26px);color:var(--green);text-shadow:0 0 8px rgba(163,230,53,.8),0 2px 0 #1a2a05;pointer-events:none;
  animation:noteUp 2.6s ease-out forwards}
@keyframes noteUp{0%{opacity:0;transform:translate(0,0) scale(.4) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--nx),-110px) scale(1.2) rotate(var(--nr))}}

/* zonas interactivas */
.hs{position:absolute;background:none;border:0;padding:0;border-radius:10px}
.hs::after{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid rgba(163,230,53,0);transition:.2s}
.hs:hover::after,.hs:focus-visible::after{border-color:rgba(163,230,53,.8);box-shadow:0 0 18px rgba(163,230,53,.5),inset 0 0 18px rgba(163,230,53,.25)}
.hs:focus{outline:none}
.tag{position:absolute;left:50%;top:0;transform:translate(-50%,-115%);white-space:nowrap;pointer-events:none;
  font-family:Bangers,cursive;letter-spacing:1px;font-size:clamp(10px,2.7vw,14px);color:#14200a;background:var(--green);
  padding:1px 7px 0;border-radius:7px;border:2px solid #14200a;box-shadow:0 2px 0 #14200a;animation:bob 2.4s ease-in-out infinite}
.tag::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-5px;border:5px solid transparent;border-top-color:#14200a}
@keyframes bob{0%,100%{transform:translate(-50%,-115%)}50%{transform:translate(-50%,-140%)}}
.hide-tags .tag{opacity:0;transition:opacity .4s}
.badge{position:absolute;right:-6px;top:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font-weight:800;font-size:12px;
  display:grid;place-items:center;border:2px solid #2a0f14;box-shadow:0 0 10px rgba(255,93,110,.7);animation:pop 1.8s ease-in-out infinite}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

#hs-pc{left:25.9%;top:44.7%;width:25.7%;height:9.1%}
#hs-safe{left:54.6%;top:45.3%;width:17.2%;height:10.2%}
#hs-armario{left:79.7%;top:16.7%;width:20.3%;height:53.8%}
#hs-armario .tag{top:30%;left:35%}
#hs-cal{left:32.1%;top:20.6%;width:19.8%;height:13.9%}
#hs-poster{left:54%;top:19.3%;width:23.4%;height:16%}
#hs-rep{left:7.7%;top:11.8%;width:14.9%;height:6.7%}
#hs-phone{left:79.3%;top:83.1%;width:11.5%;height:2.5%}
#hs-phone .tag{top:-40%}

/* móvil de la cama: la pantalla se enciende con notificaciones */
.phone-glow{left:85%;top:84.4%;width:13%;height:3.5%;border-radius:50%;mix-blend-mode:screen;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse,rgba(170,140,255,.9) 0%,rgba(120,90,255,.35) 40%,transparent 70%);opacity:0;animation:notif 7s ease-in-out infinite}
@keyframes notif{0%,62%,100%{opacity:0}66%{opacity:1}88%{opacity:.85}}
.phone-pop{left:85%;top:82.8%;font-size:clamp(12px,3.5vw,18px);transform:translate(-50%,0);opacity:0;animation:pop-heart 7s ease-out infinite}
@keyframes pop-heart{0%,64%{opacity:0;transform:translate(-50%,0) scale(.4)}68%{opacity:1;transform:translate(-50%,-40%) scale(1.1)}85%{opacity:1;transform:translate(-50%,-140%) scale(1)}92%,100%{opacity:0;transform:translate(-50%,-200%) scale(.9)}}

/* redes sociales */
.social{display:flex;align-items:center;gap:14px;padding:18px 16px;border-radius:20px;text-decoration:none;color:#fff;font-weight:800;margin-bottom:12px;border:2px solid #14200a;box-shadow:0 5px 0 #0b0716}
.social:active{transform:translateY(3px);box-shadow:0 2px 0 #0b0716}
.social .logo-s{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.18)}
.social .logo-s svg{width:30px;height:30px}
.social b{display:block;font-family:Bangers,cursive;font-weight:400;font-size:26px;letter-spacing:1px;line-height:1}
.social small{opacity:.85;font-size:13px}
.social .go{margin-left:auto;font-size:22px}
.ig{background:linear-gradient(45deg,#f9a73e 0%,#e1306c 45%,#833ab4 100%)}
.tt{background:#111;border-color:#000;box-shadow:0 5px 0 #000,-3px 0 0 #25f4ee inset,3px 0 0 #fe2c55 inset}
.edit-links{display:block;margin:6px auto 0;background:none;border:1px dashed var(--line);color:var(--muted);padding:10px 16px;border-radius:12px;font-weight:700}


/* cuadro del mapa en la pared */
#hs-mapa{left:10.2%;top:33.9%;width:21.8%;height:10.2%}

/* página del mapa */
.map-search{display:flex;gap:6px;margin-bottom:10px}
.map-search input{margin:0;flex:1}
.map-search button{flex:none}
.map-wrap{position:relative;height:50vh;min-height:260px;border-radius:16px;overflow:hidden;border:2px solid #3a2d5c;margin-bottom:12px}
#map-el{position:absolute;inset:0;background:var(--sea)}
.city-lbl{background:none;border:0;box-shadow:none;padding:0 2px;color:#3d3220;font-weight:700;font-size:11px;text-shadow:0 0 3px #fff,0 0 3px #fff}
.city-lbl::before{display:none}
.map-hint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:500;background:rgba(18,13,31,.85);color:var(--text);font-size:12px;
  padding:6px 12px;border-radius:10px;white-space:nowrap;pointer-events:none}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--green);border:2px solid #14200a;box-shadow:0 3px 6px rgba(0,0,0,.45);display:grid;place-items:center}
.pin span{transform:rotate(45deg);font-weight:800;font-size:12px;color:#14200a;font-family:Nunito,sans-serif}
.pin.empty-pin{background:#c4b5fd}
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--text);border:2px solid #3a2d5c;border-radius:14px}
.leaflet-popup-tip{background:var(--panel)}
.leaflet-popup-content{margin:12px 14px;font-family:Nunito,sans-serif}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.pop h4{margin:0 0 6px;font-size:15px;color:var(--green)}
.pop ul{margin:0 0 8px;padding-left:16px;font-size:12.5px;color:var(--muted)}
.fld{margin-bottom:10px}
.hm{display:flex;align-items:center;gap:4px;margin-top:4px}
.hm select{margin:0;flex:1;min-width:0;padding-left:8px;padding-right:4px}
.hm b{color:var(--muted)}
.fld>span{display:block;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.checks{max-height:210px;overflow:auto;border:1px solid #3a2d5c;border-radius:12px;padding:4px;margin-top:4px;background:#120d1f}
.checks label{display:flex;gap:10px;align-items:center;margin:0;padding:8px 6px;font-size:14px;text-transform:none;letter-spacing:0;color:var(--text);font-weight:600}
.tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px;padding:8px;border-radius:12px;border:1px solid #3a2d5c;background:#120d1f;min-height:48px;cursor:text}
.tags:focus-within{outline:2px solid var(--green);border-color:transparent}
.tagx{display:inline-flex;align-items:center;gap:4px;padding:5px 6px 5px 11px;border-radius:999px;background:rgba(163,230,53,.15);border:1px solid rgba(163,230,53,.45);color:var(--green);font-size:14px;font-weight:800;text-transform:none;letter-spacing:0}
.tagx button{width:22px;height:22px;border-radius:50%;border:0;background:rgba(163,230,53,.2);color:var(--green);font-size:15px;line-height:1;display:grid;place-items:center;padding:0}
.tags .tag-in{flex:1;min-width:150px;margin:0;padding:6px 4px;border:0;background:transparent;outline:none!important;font-size:16px}
.checks input{width:18px;height:18px;margin:0;display:inline-block;accent-color:var(--green);flex:none}

/* botón de música */
.music{position:fixed;left:14px;bottom:max(12px,env(safe-area-inset-bottom));z-index:6;width:46px;height:46px;border-radius:50%;border:2px solid var(--muted);
  background:rgba(18,13,31,.85);display:flex;align-items:flex-end;justify-content:center;gap:3px;padding:13px 0;transition:opacity .3s}
.music i{width:4px;height:30%;background:var(--muted);border-radius:2px}
.music::after{content:"";position:absolute;left:50%;top:50%;width:2px;height:30px;background:var(--red);transform:translate(-50%,-50%) rotate(45deg)}
.music.on{border-color:var(--green);box-shadow:0 0 12px rgba(163,230,53,.4)}
.music.on::after{display:none}
.music.on i{background:var(--green);animation:eq .9s ease-in-out infinite}
.music.on i:nth-child(2){animation-delay:-.3s}.music.on i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
body.in-menu .music{opacity:0;pointer-events:none}

/* calendario */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cal-head h4{flex:1;text-align:center;margin:0;font-family:Bangers,cursive;font-size:26px;letter-spacing:1px;font-weight:400}
.cal-head button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:18px}
.cal-sub{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{text-align:center;font-size:11px;font-weight:800;color:var(--muted);padding:4px 0}
.cal .d{min-height:54px;min-width:0;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding-top:6px!important;font-weight:800;font-size:14px;padding:0}
.cal .d.out{visibility:hidden}
.cal .d.today{border-color:var(--orange);color:var(--orange)}
.cal .d.sel{background:var(--green);color:#14200a;border-color:var(--green)}
/* barras de bolos en cada día: verde los que están por tocar, naranja los ya realizados */
:root{--prox:#4fc3ff}
.bars{display:flex;flex-direction:column;gap:2px;width:78%;margin-top:1px}
.bars i{display:block;height:4px;border-radius:3px;background:var(--green)}
.bars i.hecho{background:var(--orange)}
.bars em{font-style:normal;font-size:9px;line-height:1;color:var(--muted);font-weight:800;text-align:center}
.d.sel .bars i{box-shadow:0 0 0 1.5px #14200a}.d.sel .bars i:not(.hecho){background:#14200a}.d.sel .bars em{color:#14200a}
.cal-legend{display:flex;justify-content:center;gap:14px;margin:10px 0 2px;font-size:11.5px;color:var(--muted);font-weight:700}
.cal-legend span{display:flex;align-items:center;gap:5px}
.cal-legend i{width:16px;height:4px;border-radius:3px;background:var(--green)}
.cal-legend i.hecho{background:var(--orange)}

/* repertorio */
.folders{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin-bottom:2px;scrollbar-width:none}
.folders::-webkit-scrollbar{display:none}
.folder{flex:none;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:800;font-size:13px;white-space:nowrap}
.folder i{font-style:normal;font-size:11px;color:var(--muted);background:#120d1f;border-radius:8px;padding:1px 6px}
.folder.on{background:var(--green);color:#14200a;border-color:var(--green);box-shadow:0 3px 0 var(--green-d)}
.folder.on i{background:rgba(20,32,10,.15);color:#14200a}
.folder.new{border-style:dashed;color:var(--muted);background:transparent}
.folder-bar{display:flex;align-items:center;justify-content:space-between;margin:0 2px 8px}
.folder-bar h5{margin:0}
.song-n{font-family:Bangers,cursive;font-size:20px;color:var(--green);letter-spacing:1px}
.ico-box svg{width:22px;height:22px}
.songlink{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#120d1f;border:1px solid var(--line);text-decoration:none;color:var(--green);font-weight:800}

/* tarjetas de bolo */
.card.bolo{flex-direction:column;align-items:stretch;gap:8px;padding:14px 14px 12px;position:relative}
.bolo-top{display:flex;align-items:flex-start;gap:10px}
.bolo-top h4{flex:1;min-width:0;margin:0;font-size:17px;line-height:1.25}
.bolo-ev{margin:-4px 0 0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bolo-when{margin:0;font-size:13.5px;color:var(--text)}
.bolo-chips{display:flex;gap:6px;flex-wrap:wrap}
.bchip.ok{color:var(--green);border-color:rgba(163,230,53,.35);background:rgba(163,230,53,.1)}
.bchip{font-size:12px;font-weight:800;padding:3px 9px;border-radius:9px;background:#120d1f;border:1px solid var(--line);color:var(--muted)}
.bolo-foot{display:flex;align-items:baseline;justify-content:space-between;border-top:1px dashed rgba(255,255,255,.14);padding-top:9px;margin-top:2px}
.bolo-foot span{color:var(--muted);font-size:13px}
.bolo-foot b{font-size:21px;color:var(--green)}
.est{flex:none;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:5px 10px;border-radius:10px;border:1px solid transparent}
.est::after{content:"▾";font-size:10px;opacity:.8}
.est.proximo{background:rgba(79,195,255,.14);color:var(--prox);border-color:rgba(79,195,255,.4)}
.est.pendiente{background:rgba(255,162,69,.14);color:var(--orange);border-color:rgba(255,162,69,.35)}
.est.cobrado{background:rgba(163,230,53,.14);color:var(--green);border-color:rgba(163,230,53,.35)}
.est-menu{position:absolute;right:12px;top:46px;z-index:3;background:var(--panel);border:2px solid #3a2d5c;border-radius:14px;padding:5px;display:flex;flex-direction:column;gap:2px;box-shadow:0 10px 24px rgba(0,0,0,.5);min-width:200px}
.est-menu button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:none;border:0;border-radius:10px;padding:8px 10px;font-weight:800;font-size:13.5px}
.est-menu button small{font-weight:600;font-size:11.5px;color:var(--muted)}
.est-menu button.on,.est-menu button:hover{background:var(--panel2)}
.sum .warnbox{background:linear-gradient(135deg,#3d2a12,#24180a);border-color:rgba(255,162,69,.45)}
.warnbox b{color:var(--orange);font-size:24px}
.sum .bluebox{background:linear-gradient(135deg,#1b2547,#121833);border-color:rgba(120,160,255,.4)}
.bluebox b{color:#9db8ff;font-size:24px}
.stat .sub{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.bchip.conv{color:var(--prox);border-color:rgba(79,195,255,.4);background:rgba(79,195,255,.1)}
.bchip.warn{color:var(--orange);border-color:rgba(255,162,69,.4);background:rgba(255,162,69,.1)}
.resp-row{display:flex;gap:6px}
.resp{flex:1;padding:9px;border-radius:11px;border:1px solid var(--line);background:#120d1f;color:var(--muted);font-weight:800;font-size:13px}
.resp.si.on{background:var(--green);color:#14200a;border-color:var(--green)}
.resp.no.on{background:rgba(255,93,110,.18);color:var(--red);border-color:rgba(255,93,110,.5)}
.conv-box{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.conv-head{display:flex;align-items:center;gap:8px}.conv-head b{flex:1;font-size:14px}
.conv-tip{margin:0;color:var(--muted);font-size:12px}
.conv-list{display:flex;flex-direction:column}
.conv-row{display:flex;align-items:center;gap:10px;margin:0;padding:8px 2px;border-top:1px solid var(--line);font-size:14px;text-transform:none;letter-spacing:0;color:var(--text);font-weight:700;cursor:pointer}
.conv-row:first-child{border-top:0}
.conv-row input{width:20px;height:20px;margin:0;display:inline-block;accent-color:var(--green);flex:none}
.conv-row span{flex:1;min-width:0;display:flex;flex-direction:column}
.conv-row small{color:var(--muted);font-size:11.5px;font-weight:600}
.conv-row .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--muted);flex:none}
.conv-row .dot.on{background:var(--green);border-color:var(--green)}
/* detalles del bolo */
.det-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.det-head h3{flex:1;margin:0}
.det-place{display:flex;align-items:flex-start;gap:10px;margin:4px 0 12px}
.det-place h4{flex:1;margin:0;font-size:20px;line-height:1.2}
.det-rows{display:flex;flex-direction:column;gap:0;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin-bottom:10px}
.det-rows div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.det-rows div:last-child{border-bottom:0}
.det-rows span{color:var(--muted);font-weight:700}
.det-rows b{text-align:right}
.det-rows .tot{font-size:16px}
.det-rows .tot b{color:var(--green);font-size:18px}
.det-rows .bote-row{align-items:center}
.det-rows .bote-row span{flex:1}
.mini.undo{border-color:rgba(255,93,110,.5);color:var(--red);margin-left:6px}
.bote-ok{font-style:normal;font-size:11px;font-weight:800;color:var(--green);background:rgba(163,230,53,.14);border:1px solid rgba(163,230,53,.35);border-radius:9px;padding:3px 8px}
.det-notes{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px;font-size:14px;white-space:pre-wrap}
.det-notes small{display:block;color:var(--muted);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}

/* estadísticas */
.stats-map{height:230px;min-height:0}
.sum.sum2{grid-template-columns:1fr 1fr}
#stats-map{position:absolute;inset:0;background:var(--sea)}
.chart{display:flex;align-items:flex-end;gap:4px;height:130px;padding:0 2px;margin-bottom:6px}
.chart .col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%}
.chart .bar{flex:1;width:100%;max-width:26px;display:flex;flex-direction:column;justify-content:flex-end;gap:1px}
.chart .bar i{display:block;width:100%;background:var(--orange);border-radius:4px 4px 2px 2px;min-height:3px}
.chart .bar i.fut{background:var(--green)}
.chart em{font-style:normal;font-size:10.5px;font-weight:800;color:var(--muted);height:12px}
.chart span{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase}
.polaroids{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.polaroid{background:#f2ead8;color:#2a2018;border-radius:4px;padding:10px 10px 12px;box-shadow:0 4px 10px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:2px}
.polaroid:nth-child(odd){transform:rotate(-1.5deg)}.polaroid:nth-child(even){transform:rotate(1.2deg)}
.polaroid small{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:#7a6a55}
.polaroid b{font-family:Bangers,cursive;font-weight:400;font-size:24px;letter-spacing:.5px;color:#2a2018}
.polaroid span{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* repertorio: carpetas grandes de colores */
.carpetas{display:grid;grid-template-columns:1fr 1fr;gap:32px 30px;padding:20px 16px 0}
.carpeta{position:relative;aspect-ratio:1.3;border:0;border-radius:4px 16px 16px 16px;padding:14px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 92%,#fff),color-mix(in srgb,var(--c) 72%,#000));color:#14200a;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 45%,#000),0 8px 18px rgba(0,0,0,.35)}
.carpeta::before{content:"";position:absolute;left:0;top:-9px;width:46%;height:14px;border-radius:8px 10px 0 0;background:color-mix(in srgb,var(--c) 80%,#000)}
.carpeta::after{content:"";position:absolute;left:10px;right:10px;top:10px;height:28%;border-radius:8px;background:rgba(255,255,255,.18)}
.carpeta b{position:relative;font-family:Bangers,cursive;font-weight:400;font-size:19px;letter-spacing:.8px;line-height:1.05;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.carpeta small{position:relative;font-size:12px;font-weight:800;opacity:.75}
.carpeta-n{position:absolute;right:10px;top:10px;z-index:1;min-width:26px;height:26px;padding:0 8px;border-radius:15px;display:grid;place-items:center;background:rgba(20,32,10,.82);color:#fff;font-weight:800;font-size:13px}
.carpeta:active{transform:translateY(3px)}
.carpeta.nueva{background:transparent;border:2px dashed rgba(255,255,255,.18);color:var(--muted);box-shadow:none;align-items:center;justify-content:center}
.carpeta.nueva::before,.carpeta.nueva::after{display:none}
.carpeta.nueva b{font-family:Nunito,sans-serif;font-size:34px}
.rep-head{display:flex;align-items:center;gap:10px;margin:2px 0 12px;padding:8px 10px;border-radius:14px;background:color-mix(in srgb,var(--c) 18%,var(--panel2));border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.rep-head h4{flex:1;margin:0;font-family:Bangers,cursive;font-weight:400;font-size:24px;letter-spacing:1px;color:var(--c)}
.tag-carpeta{display:inline-block;margin-top:4px;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:8px;text-transform:uppercase;letter-spacing:.4px;
  color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.sw{margin:0;cursor:pointer;position:relative}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw i{display:block;width:38px;height:38px;border-radius:12px;border:3px solid transparent;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.sw input:checked+i{border-color:#fff;box-shadow:0 0 0 2px #14200a,0 0 12px rgba(255,255,255,.35)}
.sw input:focus-visible+i{outline:2px solid var(--green);outline-offset:2px}

/* miembros */
.avatar{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:19px;color:#14200a;border:2px solid #14200a}
.right.acts{flex-direction:row}
.acts a{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#120d1f;border:1px solid var(--line);text-decoration:none;font-size:16px}

/* caja fuerte: piloto del teclado parpadeando + destello dorado al abrir */
.safe-led{left:66.2%;top:49.6%;width:1.1%;aspect-ratio:1;border-radius:50%;background:#7dff5a;box-shadow:0 0 6px 2px rgba(125,255,90,.8);transform:translate(-50%,-50%);animation:led 2.2s steps(1) infinite}
@keyframes led{0%,60%{opacity:1}61%,100%{opacity:.15}}
.safe-glow{left:63.2%;top:50.4%;width:45%;aspect-ratio:1;border-radius:50%;mix-blend-mode:screen;transform:translate(-50%,-50%) scale(.3);opacity:0;
  background:radial-gradient(circle,rgba(255,225,120,.9) 0%,rgba(255,180,60,.35) 35%,transparent 65%);transition:opacity .4s,transform .5s cubic-bezier(.3,1.5,.5,1)}
#stage.safe-open .safe-glow{opacity:1;transform:translate(-50%,-50%) scale(1)}
#stage.safe-open .safe-led{background:#ffd34d;box-shadow:0 0 8px 3px rgba(255,211,77,.9);animation:none}

/* HUD */
.hud{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 14px 18px;
  background:linear-gradient(rgba(18,13,31,.92),rgba(18,13,31,.6) 65%,transparent);transition:opacity .3s}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;background:none;border:0;padding:0;text-align:left;color:inherit}
.logo{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:#1a2a05;border:2px solid var(--green);box-shadow:0 0 12px rgba(163,230,53,.5)}
.brand b{font-family:Bangers,cursive;font-size:20px;letter-spacing:1px;color:var(--green);display:block;line-height:1}
.brand small{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px}
.chip{display:flex;align-items:center;gap:5px;background:rgba(37,28,62,.9);border:1px solid var(--line);border-radius:20px;padding:6px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.hint{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;background:rgba(18,13,31,.75);border:1px solid var(--line);
  padding:7px 14px;border-radius:20px;font-size:13px;color:var(--muted);white-space:nowrap;transition:opacity .3s;backdrop-filter:blur(4px)}
body.in-menu .hud,body.in-menu .hint{opacity:0;pointer-events:none}
@media (max-width:380px){.hud{gap:6px;padding-left:10px;padding-right:10px}.chip{padding:5px 8px;font-size:12px;gap:3px}.logo{width:32px;height:32px;font-size:18px}.brand b{font-size:17px}}

/* ---------- PANEL (bottom sheet) ---------- */
.sheet{position:fixed;left:50%;bottom:0;z-index:10;width:min(100%,520px);height:88%;transform:translate(-50%,105%);transition:transform .45s cubic-bezier(.2,.9,.3,1);
  background:var(--panel);border:2px solid #3a2d5c;border-bottom:0;border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.6)}
.sheet.show{transform:translate(-50%,0)}
.sheet-head{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.sheet-head .ico{font-size:28px}
.sheet-head h2{margin:0;font-family:Bangers,cursive;font-weight:400;letter-spacing:1.5px;font-size:30px;color:var(--green);text-shadow:0 2px 0 #14200a;flex:1}
.x{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:16px}
.tabs{display:flex;gap:6px;padding:0 16px 10px}
.tabs button{flex:1;padding:9px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:800}
.tabs button.on{background:var(--green);color:#14200a;border-color:var(--green);box-shadow:0 3px 0 var(--green-d)}
.body{flex:1;overflow:auto;padding:4px 16px 100px}
.fab{position:absolute;right:18px;bottom:max(20px,env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;border:2px solid #14200a;background:var(--green);color:#14200a;
  font-size:32px;font-weight:800;line-height:1;box-shadow:0 5px 0 #14200a,0 0 20px rgba(163,230,53,.4)}
.fab:active{transform:translateY(3px);box-shadow:0 2px 0 #14200a}

<script>
/* ================= UTILIDADES ================= */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const z = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
const TODAY = () => iso(new Date());
const eur = n => (n || 0).toLocaleString('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 2 });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fdate = s => { const [y, m, d] = s.split('-'); return `${+d} ${MES[m - 1]} ${y}`; };
const daysTo = s => Math.round((new Date(s + 'T00:00') - new Date(TODAY() + 'T00:00')) / 864e5);

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ================= DATOS (localStorage) ================= */
const KEY = 'crocknroll-v1';
function seed() {
  return {
    miembros: [['Óscar', 'Trompeta'], ['Lucía', 'Saxo alto'], ['Pablo', 'Trombón'], ['Marta', 'Trompeta'], ['Javi', 'Tuba'], ['Carmen', 'Clarinete'], ['Dani', 'Bombo'], ['Irene', 'Caja']]
      .map(([nombre, instrumento], i) => ({ id: uid(), nombre, instrumento, telefono: '600 000 00' + (i + 1), notas: '' })),
    bolos: [
      { id: uid(), fecha: addDays(4), hora: '18:30', horaFin: '22:30', titulo: 'Fiestas de San Martín', lugar: 'Plaza Mayor', cachet: 650, cacheMusico: 60, musicos: 8, gasolina: 40, presBote: 90, estado: 'proximo', notas: 'Pasacalles + concierto' },
      { id: uid(), fecha: addDays(11), hora: '13:00', horaFin: '17:00', titulo: 'Boda Ana & Luis', lugar: 'Finca El Olivar', cachet: 900, cacheMusico: 90, musicos: 8, gasolina: 60, presBote: 120, estado: 'proximo', notas: 'Entrada de novios' },
      { id: uid(), fecha: addDays(23), hora: '20:00', horaFin: '23:00', titulo: 'Cena peña Los Tranquis', lugar: 'Bar La Charca', cachet: 300, cacheMusico: 45, musicos: 6, gasolina: 0, presBote: 30, estado: 'proximo', notas: '' },
      { id: uid(), fecha: addDays(-9), hora: '12:00', horaFin: '15:00', titulo: 'Romería del Pilar', lugar: 'Ermita', cachet: 500, cacheMusico: 50, musicos: 8, gasolina: 20, presBote: 80, estado: 'cobrado', notas: '' }
    ],
    inventario: [
      { id: uid(), cat: 'ropa', nombre: 'Camiseta verde Crock&Roll', cant: 14, detalle: 'Tallas S–XL', asignado: '', estado: 'bien' },
      { id: uid(), cat: 'ropa', nombre: 'Sudadera negra', cant: 9, detalle: 'Logo bordado', asignado: '', estado: 'bien' },
      { id: uid(), cat: 'ropa', nombre: 'Gafas de sol rana', cant: 6, detalle: 'Atrezo', asignado: '', estado: 'reparar' },
      { id: uid(), cat: 'inst', nombre: 'Trompeta Yamaha', cant: 1, detalle: 'Nº serie 4471', asignado: 'Óscar', estado: 'bien' },
      { id: uid(), cat: 'inst', nombre: 'Bombo', cant: 1, detalle: 'Parche nuevo', asignado: 'Dani', estado: 'bien' },
      { id: uid(), cat: 'inst', nombre: 'Caja', cant: 2, detalle: '', asignado: 'Irene', estado: 'reparar' },
      { id: uid(), cat: 'inst', nombre: 'Trombón', cant: 1, detalle: '', asignado: 'Pablo', estado: 'bien' },
      { id: uid(), cat: 'mat', nombre: 'Atriles plegables', cant: 8, detalle: '', asignado: '', estado: 'bien' },
      { id: uid(), cat: 'mat', nombre: 'Pancarta Crock&Roll', cant: 1, detalle: '3 x 1 m', asignado: '', estado: 'bien' }
    ],
    movimientos: [
      { id: uid(), fecha: addDays(-9), concepto: 'Cachet: Romería del Pilar', importe: 500 },
      { id: uid(), fecha: addDays(-20), concepto: 'Camisetas nuevas', importe: -210 },
      { id: uid(), fecha: addDays(-35), concepto: 'Cachet: Fiestas del barrio', importe: 700 },
      { id: uid(), fecha: addDays(-40), concepto: 'Reparación bombo', importe: -45 }
    ],
    bote: [
      { id: uid(), fecha: addDays(-35), concepto: 'Bolo: Fiestas del barrio', importe: 100 },
      { id: uid(), fecha: addDays(-9), concepto: 'Bolo: Romería del Pilar', importe: 80 },
      { id: uid(), fecha: addDays(-9), concepto: 'Cañas post-romería', importe: -18.5 }
    ]
  };
}
let DB;
try { DB = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
// con la nube configurada no se inventan datos de ejemplo: llegan de Firestore
const NUBE = !!(window.FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId);
if (!DB) DB = NUBE ? { miembros: [], bolos: [], inventario: [], movimientos: [], bote: [], repertorio: { carpetas: [], canciones: [] } } : seed();
// migración: versiones anteriores guardaban los miembros como texto
if (DB.miembros.length && typeof DB.miembros[0] === 'string') DB.miembros = DB.miembros.map(n => ({ id: uid(), nombre: n, instrumento: '', telefono: '', notas: '' }));
// migración: el estado del bolo ahora es próximo / pendiente (de cobro) / cobrado
DB.bolos.forEach(b => {
  if (b.cobro !== undefined || b.cobrado !== undefined || !['proximo', 'pendiente', 'cobrado'].includes(b.estado) || b.horaFin === undefined) {
    if (b.cobro !== undefined || b.cobrado !== undefined) {
      const cobrado = b.cobro === 'total' || b.cobrado === true;
      if (!b.presBote && +b.fianza) b.presBote = +b.fianza;
      b.estado = cobrado ? 'cobrado' : b.fecha >= TODAY() ? 'proximo' : 'pendiente';
    }
    delete b.cobro; delete b.cobrado; delete b.fianza;
    if (!['proximo', 'pendiente', 'cobrado'].includes(b.estado)) b.estado = b.fecha >= TODAY() ? 'proximo' : 'pendiente';
    ['horaFin', 'musicos', 'gasolina', 'presBote', 'cacheMusico'].forEach(k => { if (b[k] === undefined) b[k] = k === 'horaFin' ? '' : k === 'musicos' ? DB.miembros.length : 0; });
  }
});
DB.bolos.forEach(b => { if (b.cacheMusico === undefined) b.cacheMusico = 0; });
// convocatoria de cada bolo: quién se apunta (resp), quién va (sel) y a quién se ha pagado (pagos)
DB.bolos.forEach(b => { if (!b.conv) b.conv = { abierta: b.fecha >= TODAY(), resp: {}, sel: [], pagos: {} }; });
// un bolo "próximo" cuya fecha ya pasó queda pendiente de cobro
const avanzarEstados = () => DB.bolos.forEach(b => { if (b.estado === 'proximo' && b.fecha < TODAY()) b.estado = 'pendiente'; });
avanzarEstados();
const nombres = () => DB.miembros.map(m => m.nombre);
if (!DB.repertorio) {
  const c = [['Pasacalles'], ['Fiestas'], ['Bodas']].map(([nombre]) => ({ id: uid(), nombre }));
  const can = (titulo, autor, i, tono) => ({ id: uid(), titulo, autor, carpeta: c[i].id, tono, enlace: '', notas: '' });
  DB.repertorio = { carpetas: c, canciones: [
    can('Paquito el Chocolatero', 'Gustavo Pascual Falcó', 0, 'Sib'),
    can('Amparito Roca', 'Jaime Texidor', 0, 'Fa'),
    can('Sarandonga', 'Popular', 1, 'Do'),
    can('Vamos a la playa', 'Righeira', 1, 'Sol'),
    can('Marcha nupcial', 'Mendelssohn', 2, 'Do')
  ] };
}
if (!DB.redes) DB.redes = { instagram: 'charanga_crocknroll', tiktok: 'charanga_crocknroll' };
if (!DB.geo) DB.geo = {};
function save() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} if (window.Nube) Nube.push(); refreshHud(); }
// sin nube (o en la página de Claude) quien usa la app es la directiva; con nube, depende de la sesión
const esAdmin = () => !window.Nube || Nube.esAdmin();
const yo = () => window.Nube ? Nube.miembroId() : null;

const totalBote = () => DB.bote.reduce((a, m) => a + m.importe, 0);
const proximos = () => DB.bolos.filter(b => b.fecha >= TODAY()).sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));

function refreshHud() {
  $('#hud-saldo').textContent = eur(totalBote());
  const p = proximos()[0];
  const d = p ? daysTo(p.fecha) : null;
  $('#hud-next').textContent = p ? (d === 0 ? '¡Hoy!' : d === 1 ? 'Mañana' : `en ${d} días`) : 'Sin bolos';
  const n = proximos().filter(b => daysTo(b.fecha) <= 30).length;
  const bd = $('#badge-bolos'); bd.hidden = !n; bd.textContent = n;
}

/* ================= ESCENA ================= */
const stage = $('#stage'), img = $('#room');
let IW = 941, IH = 1672;
// la imagen se ve siempre entera (sin recortar los lados); el hueco que sobra arriba y abajo
// lo rellena el fondo desenfocado de la misma habitación (#fondo)
function layout() {
  const W = innerWidth, H = innerHeight;
  const s = Math.min(W / IW, H / IH);
  const w = IW * s, h = IH * s;
  Object.assign(stage.style, { width: w + 'px', height: h + 'px', left: (W - w) / 2 + 'px', top: (H - h) / 2 + 'px' });
  img.style.borderRadius = '0';
}
img.onload = () => { IW = img.naturalWidth; IH = img.naturalHeight; layout(); };


addEventListener('resize', layout); layout();

// partículas de polvo en el haz de luz
(() => {
  const box = $('#dust');
  for (let i = 0; i < 24; i++) {
    const s = document.createElement('span'), sz = 1.5 + Math.random() * 2.5;
    Object.assign(s.style, {
      left: Math.random() * 55 + '%', top: 25 + Math.random() * 60 + '%', width: sz + 'px', height: sz + 'px',
      animationDuration: 7 + Math.random() * 8 + 's', animationDelay: -Math.random() * 12 + 's'
    });
    s.style.setProperty('--dx', (Math.random() * 60 - 20) + 'px');
    s.style.setProperty('--dy', (Math.random() * -80 - 10) + 'px');
    box.appendChild(s);
  }
})();

// notas musicales saliendo de la trompeta
function spawnNote() {
  const n = document.createElement('span');
  n.className = 'note';
  n.textContent = ['♪', '♫', '♬', '♩'][Math.random() * 4 | 0];
  n.style.left = (73 + Math.random() * 3) + '%';
  n.style.top = (66 + Math.random() * 2) + '%';
  n.style.setProperty('--nx', (Math.random() * 50 - 40) + 'px');
  n.style.setProperty('--nr', (Math.random() * 60 - 30) + 'deg');
  $('#notes').appendChild(n);
  setTimeout(() => n.remove(), 2700);
}
setInterval(() => { if (!document.hidden) spawnNote(); }, 1400);

let actx;
const getCtx = () => actx || (actx = new (window.AudioContext || window.webkitAudioContext)());
/* ===== Música lo-fi generada en directo (sin archivos, sin derechos, sin crepitar de vinilo) ===== */
const Lofi = (() => {
  let ctx, out, bus, noise, timer, playing = false, step = 0, next = 0;
  const BPM = 72, S16 = 60 / BPM / 4, VOL = .55;
  const PROG = [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60, 64], [48, 52, 55, 59]]; // Fmaj7 Em7 Dm9 Cmaj7
  const PENTA = [72, 74, 76, 79, 81, 84];
  const f = m => 440 * Math.pow(2, (m - 69) / 12);
  function init() {
    ctx = getCtx();
    out = ctx.createGain(); out.gain.value = 0;
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3;
    out.connect(comp).connect(ctx.destination);
    bus = ctx.createBiquadFilter(); bus.type = 'lowpass'; bus.frequency.value = 2400; bus.connect(out);
    noise = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const env = (g, t, a, peak, dur) => { g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + dur); };
  function key(m, t, dur, v) { // piano eléctrico suave con "cinta" desafinada
    const g = ctx.createGain(); env(g, t, .03, v, dur);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1300;

  };
  form.onsubmit = e => e.preventDefault();
  $('#d-x').onclick = closeForm;
  if ($('#d-edit')) $('#d-edit').onclick = () => formBolo(B());
  // deshacer el cobro del bote: se borra de la caja fuerte la aportación ligada a este bolo (pide confirmación)
  if ($('#d-undo')) $('#d-undo').onclick = ev => {

    const btn = ev.currentTarget;
    if (!btn.dataset.sure) { btn.dataset.sure = 1; btn.textContent = '¿Seguro?'; return; }
    DB.bolos = DB.bolos.filter(x => x.id !== id); save(); closeForm(); rerender(); toast('🗑️ Eliminado');

}

const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();

  if (!DB.geo[norm(u.nombre)]) DB.geo[norm(u.nombre)] = [u.lat, u.lng];
  (u.bolos || []).forEach(id => { const b = DB.bolos.find(x => x.id === id); if (b && b.lugar && !DB.geo[norm(b.lugar)]) DB.geo[norm(b.lugar)] = [u.lat, u.lng]; });
});
let geoCola = Promise.resolve();
function geolocalizar(lugar) {
  const k = norm(lugar);
  if (!k || DB.geo[k] !== undefined) return Promise.resolve(DB.geo[k] || null);
  const c = CIUDADES.find(([n]) => norm(n) === k);
  if (c) { DB.geo[k] = [c[1], c[2]]; return Promise.resolve(DB.geo[k]); }
  // buscador de OpenStreetMap, de uno en uno y con pausa para respetar su uso justo
  geoCola = geoCola.then(async () => {
    if (DB.geo[k] !== undefined) return;
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=es&accept-language=es&q=${encodeURIComponent(lugar)}`);
      const [p] = await r.json();
      DB.geo[k] = p ? [+p.lat, +p.lon] : 0;
    } catch (e) { /* sin conexión: se reintentará otro día */ }
    await new Promise(r => setTimeout(r, 1100));
  });
  return geoCola.then(() => DB.geo[k] || null);
}

let statYear = String(new Date().getFullYear()), smap = null;

  const tocados = delAño.filter(hecho), futuros = delAño.filter(b => !hecho(b));

async function pintarMapaStats(pueblos) {
  if (smap) { smap.remove(); smap = null; }
  const el = $('#stats-map'); if (!el) return;
  if (!window.L) { $('#stats-hint').textContent = 'No se pudo cargar el mapa'; return; }
  const m = smap = L.map(el, { zoomControl: false, attributionControl: false, zoomSnap: .25 });
  m.fitBounds([[36, -9.3], [43.8, 3.3]]);
  m.createPane('base'); m.getPane('base').style.zIndex = 150;
  cargarProvincias().then(geo => { if (geo && smap === m) L.geoJSON(geo, { pane: 'base', interactive: false, style: { color: '#9b8f78', weight: 1, fillColor: '#f2ead8', fillOpacity: 1 } }).addTo(m); });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(m);
  setTimeout(() => smap === m && m.invalidateSize(), 450);
  const lista = Object.values(pueblos);
  let puestos = 0, sinSitio = [];
  const puntos = [];
  for (const p of lista) {
    const c = await geolocalizar(p.nombre);
    if (smap !== m) return; // se cambió de temporada o se cerró la página
    if (!c) { sinSitio.push(p.nombre); continue; }
    const n = p.tocados + p.futuros, color = p.tocados ? '#ffa245' : '#a3e635';
    L.circleMarker(c, { radius: 6 + Math.min(10, n * 2), color: '#14200a', weight: 2, fillColor: color, fillOpacity: .9 })
      .bindTooltip(`${esc(p.nombre)} · ${n} bolo${n === 1 ? '' : 's'}`, { direction: 'top' }).addTo(m);
    puntos.push(c); puestos++;
  }
  try { save(); } catch (e) {}
  const hint = $('#stats-hint'); if (!hint) return;
  if (puntos.length) m.fitBounds(L.latLngBounds(puntos).pad(.6), { maxZoom: 9 });
  hint.textContent = !lista.length ? hint.textContent : sinSitio.length ? `No encuentro: ${sinSitio.slice(0, 3).join(', ')}${sinSitio.length > 3 ? '…' : ''}` : '';
  hint.style.display = hint.textContent ? '' : 'none';
}

/* ================= AJUSTES Y COPIA DE SEGURIDAD (tocar el logo) ================= */
function abrirAjustes() {
  const form = $('#form'), datos = JSON.stringify(DB);
  form.onclick = null;
  form.innerHTML = `<div class="det-head"><h3>Ajustes</h3><button type="button" class="x" id="aj-x" aria-label="Cerrar">✕</button></div>
    ${window.Nube ? Nube.ajustesHtml() : ''}
    <div class="conv-box"><div class="conv-head"><b>💾 Copia de seguridad</b></div>
      <p class="conv-tip">Todos los datos (bolos, bote, inventario, banda, repertorio…). Sirve para pasarlos a la app de la charanga o guardarlos aparte.</p>
      <textarea id="aj-export" rows="3" readonly>${esc(datos)}</textarea>
      <div class="row" style="margin:0"><button type="button" class="btn" id="aj-copy" style="flex:1">📋 Copiar</button><button type="button" class="btn" id="aj-down" style="flex:1">⬇️ Descargar</button></div>
    </div>
    ${esAdmin() ? `<div class="conv-box"><div class="conv-head"><b>📥 Importar datos</b></div>
      <p class="conv-tip">Pega aquí una copia de seguridad. <b style="color:var(--red)">Sustituye todos los datos actuales.</b></p>
      <textarea id="aj-import" rows="3" placeholder="Pega la copia aquí…"></textarea>
      <button type="button" class="btn danger" id="aj-imp">Importar y sustituir</button>
    </div>` : ''}`;
  form.onsubmit = e => e.preventDefault();
  $('#aj-x').onclick = closeForm;
  $('#aj-copy').onclick = async () => {
    const t = $('#aj-export'); t.select();
    try { await navigator.clipboard.writeText(datos); toast('📋 Copiado'); }
    catch (e) { try { document.execCommand('copy'); toast('📋 Copiado'); } catch (e2) { toast('Selecciona el texto y cópialo'); } }
  };
  $('#aj-down').onclick = async () => {
    // dentro de Claude se descarga con su permiso de descargas; en la app, con un enlace normal
    try {
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if (dl) { await dl.save({ filename: `crocknroll-copia-${TODAY()}.json`, data: datos }); return; }
    } catch (e) { return toast('Descarga cancelada: usa Copiar'); }
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([datos], { type: 'application/json' }));
      a.download = `crocknroll-copia-${TODAY()}.json`; document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { toast('No se pudo descargar: usa Copiar'); }
  };
  if ($('#aj-imp')) $('#aj-imp').onclick = async ev => {
    let d; try { d = JSON.parse($('#aj-import').value); } catch (e) { return toast('⚠️ El texto no es una copia válida'); }
    if (!d || !Array.isArray(d.bolos) || !Array.isArray(d.miembros)) return toast('⚠️ El texto no es una copia válida');
    const btn = ev.currentTarget;
    if (!btn.dataset.sure) { btn.dataset.sure = 1; btn.textContent = '¿Seguro? Se sustituye todo'; return; }
    btn.disabled = true; btn.textContent = 'Importando…';
    try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
    if (window.Nube) { try { await Nube.reemplazarTodo(d); } catch (e) { toast('⚠️ No se pudo subir a la nube'); btn.disabled = false; return; } }
    location.reload();
  };
  if (window.Nube) Nube.ajustesBind(form);
  $('#modal').classList.add('show');
}
$('#brand').addEventListener('click', abrirAjustes);

/* ================= FORMULARIO GENÉRICO ================= */
function fieldHtml(f, data) {
  if (f.t === 'tags') { // etiquetas: se escribe y se añade con Intro (o coma); la × la quita
    const vals = Array.isArray(data[f.k]) ? data[f.k] : [];
    return `<div class="fld"><span>${f.l}</span><div class="tags" data-tags="${f.k}">
      ${vals.map(t => `<span class="tagx" data-v="${esc(t)}">${esc(t)}<button type="button" aria-label="Quitar ${esc(t)}">×</button></span>`).join('')}
      <input class="tag-in" list="dl-${f.k}" placeholder="${esc(f.ph || 'Escribe y pulsa Intro')}" enterkeyhint="done" autocomplete="off">
      </div>${f.sug ? `<datalist id="dl-${f.k}">${f.sug.map(x => `<option value="${esc(x)}">`).join('')}</datalist>` : ''}</div>`;
  }
  if (f.t === 'colores') { // muestrario de colores (radio)
    return `<div class="fld"><span>${f.l}</span><div class="swatches">${f.o.map(([val, lab]) =>
      `<label class="sw" title="${lab}"><input type="radio" name="${f.k}" value="${val}" ${data[f.k] === val ? 'checked' : ''} aria-label="${lab}"><i style="background:${val}"></i></label>`).join('')}</div></div>`;
  }
  if (f.t === 'hm') { // hora en dos desplegables: horas y minutos (00, 15, 30, 45)
    const [h, m] = String(data[f.k] || '').split(':');
    const mins = ['00', '15', '30', '45'].concat(m && !['00', '15', '30', '45'].includes(m) ? [m] : []);
    const opt = (val, lab, cur) => `<option value="${val}" ${val === (cur || '') ? 'selected' : ''}>${lab}</option>`;
    return `<div class="fld"><span>${f.l}</span><div class="hm">
      <select name="${f.k}__h" aria-label="${f.l}: horas">${opt('', '—', h)}${Array.from({ length: 24 }, (_, i) => opt(z(i), z(i), h)).join('')}</select>
      <b>:</b>
      <select name="${f.k}__m" aria-label="${f.l}: minutos">${h ? '' : opt('', '—', m)}${mins.map(x => opt(x, x, h ? (m || '00') : m)).join('')}</select>
    </div></div>`;
  }
  if (f.t === 'checks') {
    const sel = data[f.k] || [];
    return `<div class="fld"><span>${f.l}</span><div class="checks ${f.cls || ''}">${f.o.map(([val, lab]) =>
      `<label><input type="checkbox" name="${f.k}" value="${esc(val)}" ${sel.includes(val) ? 'checked' : ''}>${esc(lab)}</label>`).join('')
      || '<p style="color:var(--muted);margin:6px">No hay bolos todavía.</p>'}</div></div>`;
  }
  const v = esc(data[f.k] ?? '');
  const req = f.req ? 'required' : '';
  let input;
  if (f.t === 'select') input = `<select name="${f.k}">${f.o.map(([val, lab]) => `<option value="${esc(val)}" ${String(data[f.k] ?? '') === String(val) ? 'selected' : ''}>${esc(lab)}</option>`).join('')}</select>`;
  else if (f.t === 'textarea') input = `<textarea name="${f.k}" rows="2">${v}</textarea>`;
  else input = `<input name="${f.k}" type="${f.t || 'text'}" value="${v}" ${f.t === 'number' ? 'step="any" inputmode="decimal"' : ''} ${req}>`;
  return `<label>${f.l}${input}</label>`;
}
// comportamiento del campo de etiquetas
function prepararTags(box) {
  const inp = box.querySelector('.tag-in');
  const nueva = txt => {
    txt.split(',').map(x => x.trim()).filter(Boolean).forEach(t => {
      t = t.charAt(0).toUpperCase() + t.slice(1);
      if ([...box.querySelectorAll('.tagx')].some(x => x.dataset.v.toLowerCase() === t.toLowerCase())) return;
      const el = document.createElement('span'); el.className = 'tagx'; el.dataset.v = t;
      el.textContent = t; const b = document.createElement('button'); b.type = 'button'; b.textContent = '×'; b.setAttribute('aria-label', 'Quitar ' + t);
      el.appendChild(b); box.insertBefore(el, inp);
    });
    inp.value = '';
  };
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); nueva(inp.value); }
    else if (e.key === 'Backspace' && !inp.value) { const ult = [...box.querySelectorAll('.tagx')].pop(); if (ult) ult.remove(); }
  });
  inp.addEventListener('change', () => { if (inp.value.trim()) nueva(inp.value); }); // al elegir una sugerencia
  box.addEventListener('click', e => { const b = e.target.closest('.tagx button'); if (b) b.parentElement.remove(); else inp.focus(); });
}
function openForm({ title, fields, data, onSave, onDelete, libre }) {
  if (!libre && !esAdmin()) return toast('Solo la directiva puede editar');
  $('#form').onclick = null;
  const form = $('#form');
  form.innerHTML = `<h3>${title}</h3>` +
    fields.map(f => Array.isArray(f) ? `<div class="grid2">${f.map(x => fieldHtml(x, data)).join('')}</div>` : fieldHtml(f, data)).join('') +
    `<div class="row">${onDelete ? '<button type="button" class="btn danger" id="f-del">🗑️</button>' : ''}<span style="flex:1"></span>
     <button type="button" class="btn" id="f-cancel">Cancelar</button><button class="btn primary">Guardar</button></div>`;
  form.querySelectorAll('.tags').forEach(prepararTags);
  form.onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(form), v = Object.fromEntries(fd);
    fields.flat().forEach(f => {
      if (f.t === 'checks') v[f.k] = fd.getAll(f.k);
      if (f.t === 'tags') {
        const box = form.querySelector(`[data-tags="${f.k}"]`), pendiente = box.querySelector('.tag-in').value.trim();
        const vals = [...box.querySelectorAll('.tagx')].map(t => t.dataset.v);
        if (pendiente) vals.push(...pendiente.split(',').map(x => x.trim()).filter(Boolean)); // lo escrito sin pulsar Intro también cuenta
        v[f.k] = [...new Set(vals)];
      }
      if (f.t === 'hm') { const h = v[f.k + '__h'], m = v[f.k + '__m'] || '00'; v[f.k] = h ? `${h}:${m}` : ''; delete v[f.k + '__h']; delete v[f.k + '__m']; }
    });
    onSave(v); save(); closeForm(); rerender(); toast('✅ Guardado');
  };
  $('#f-cancel').onclick = closeForm;
  if (onDelete) $('#f-del').onclick = e => {
    const b = e.currentTarget;
    if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = '¿Seguro?'; return; }
    onDelete(); save(); closeForm(); rerender(); toast('🗑️ Eliminado');
  };
  $('#modal').classList.add('show');
}
function closeForm() { $('#modal').classList.remove('show'); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeForm(); });
addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#modal').classList.contains('show')) closeForm(); else if (cur.sec) closeSection(); } });

// las etiquetas se ocultan tras unos segundos para dejar ver la escena; vuelven al tocar el fondo
let tagTimer;
function showTags() { $('#viewport').classList.remove('hide-tags'); clearTimeout(tagTimer); tagTimer = setTimeout(() => $('#viewport').classList.add('hide-tags'), 6000); }
$('#viewport').addEventListener('click', e => { if (!e.target.closest('.hs')) showTags(); });
showTags();

refreshHud();
// si la imagen ya estaba cargada antes de llegar aquí, se ajusta ahora
if (img.complete && img.naturalWidth) img.onload();
